<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Panel{% endblock %} · TenderoBot</title>
  <script>
    // Antes de pintar: con JS los bloques de abajo aparecen al hacer scroll; en la recarga
    // automática del panel no se repite la animación de entrada.
    document.documentElement.classList.add("js");
    try { if (sessionStorage.getItem("tenderobot-scroll") !== null) { document.documentElement.classList.add("no-intro"); } } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="/panel/static/favicon.png?v={{ static_version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap">
  <link rel="stylesheet" href="/panel/static/panel.css?v={{ static_version }}">
</head>
<body{% if active is defined %} data-live="{% block live %}reload{% endblock %}"{% endif %}>
  {% if active is defined %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/panel">
        <img src="/panel/static/logo.png" alt="">
        <span>TenderoBot<small>Panel del distribuidor</small></span>
      </a>
      <nav class="menu" aria-label="Secciones">
        <a href="/panel" class="{{ 'on' if active == 'overview' }}">Resumen</a>
        <a href="/panel/tiendas" class="{{ 'on' if active == 'stores' }}">Tiendas</a>
        <a href="/panel/solicitudes" class="{{ 'on' if active == 'requests' }}">Solicitudes <span class="menu-count" id="requests-count" hidden></span></a>
        <a href="/panel/demanda" class="{{ 'on' if active == 'demand' }}">Demanda</a>
        <a href="/panel/productos" class="{{ 'on' if active == 'products' }}">Productos</a>
      </nav>
      <div class="topbar-actions">
        <span class="live-pill" id="live-pill" title="El panel se actualiza solo con lo que llega de Telegram"><span class="live-dot"></span><span class="live-text">En vivo</span></span>
        <form method="post" action="/panel/logout" class="logout">
          <button type="submit">Salir</button>
        </form>
      </div>
    </div>
  </header>
  {% endif %}
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% if active is defined %}
  <div class="live-toast" id="live-toast" role="status" hidden>
    <span class="live-dot"></span>
    <span>Llegaron datos nuevos desde Telegram.</span>
    <button type="button" class="small-btn" id="live-refresh">Actualizar</button>
  </div>
  <script>
    // Panel en vivo: consulta si cambió algo y se actualiza solo (o avisa si estás editando).
    (function () {
      var mode = document.body.dataset.live;
      var pill = document.getElementById("live-pill");
      var toast = document.getElementById("live-toast");
      var version = null;
      try {
        var y = sessionStorage.getItem("tenderobot-scroll");
        if (y !== null) { sessionStorage.removeItem("tenderobot-scroll"); window.scrollTo({ top: parseInt(y, 10), behavior: "instant" }); }
      } catch (e) {}

      function reload() {
        try { sessionStorage.setItem("tenderobot-scroll", String(window.scrollY)); } catch (e) {}
        window.location.reload();
      }
      function busy() {
        var el = document.activeElement;
        return document.querySelector(".modal-overlay:not([hidden]), .sales-row") ||
          (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName));
      }
      function check() {
        if (document.hidden) { return; }
        fetch("/panel/actualizacion", { headers: { Accept: "application/json" }, cache: "no-store" })
          .then(function (r) {
            if (!r.ok || (r.headers.get("content-type") || "").indexOf("json") < 0) { throw new Error(); }
            return r.json();
          })
          .then(function (data) {
            pill.classList.remove("off");
            pill.querySelector(".live-text").textContent = "En vivo";
            var count = document.getElementById("requests-count");
            count.textContent = data.pending_requests;
            count.hidden = !data.pending_requests;
            if (version === null) { version = data.version; return; }
            if (data.version === version) { return; }
            version = data.version;
            if (mode === "reload" && !busy()) { reload(); } else { toast.hidden = false; }
          })
          .catch(function () {
            pill.classList.add("off");
            pill.querySelector(".live-text").textContent = "Sin conexión";
          });
      }
      document.getElementById("live-refresh").addEventListener("click", reload);
      document.addEventListener("visibilitychange", check);
      check();
      setInterval(check, 8000);
    })();
  </script>
  {% endif %}
  <script>
    // Bloques que aparecen al entrar a la pantalla y números que cuentan hasta su valor.
    (function () {
      var reveals = document.querySelectorAll(".reveal");
      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { entry.target.classList.add("in"); observer.unobserve(entry.target); }
          });
        }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
        reveals.forEach(function (el) { observer.observe(el); });
      } else {
        reveals.forEach(function (el) { el.classList.add("in"); });
      }

      var instant = document.documentElement.classList.contains("no-intro") ||
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.querySelectorAll("[data-count]").forEach(function (el) {
        var target = Number(el.dataset.count) || 0;
        var prefix = el.dataset.prefix || "";
        function show(value) {
          el.textContent = prefix + String(Math.round(value)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }
        if (instant || target === 0) { return; }
        var start = null;
        function step(now) {
          if (start === null) { start = now; }
          var progress = Math.min(1, (now - start) / 1100);
          show(target * (1 - Math.pow(1 - progress, 4)));
          if (progress < 1) { requestAnimationFrame(step); }
        }
        show(0);
        requestAnimationFrame(step);
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>

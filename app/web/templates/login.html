{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<section class="login-card">
  <h1>TenderoBot <span>· Panel</span></h1>
  <p class="muted">Ingresa con tu cuenta de distribuidor.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/panel/login">
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary">Ingresar</button>
  </form>
</section>
{% endblock %}
